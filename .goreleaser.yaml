version: 2

project_name: terramate

builds:
  - id: terramate
    main: ./cmd/terramate
    binary: terramate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags "-static"
    goos:
      - linux
    goarch:
      - amd64

  - id: terramate-ls
    main: ./cmd/terramate-ls
    binary: terramate-ls
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -extldflags "-static"
    goos:
      - linux
    goarch:
      - amd64

archives:
  - id: default
    ids:
      - terramate
      - terramate-ls
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"

release:
  prerelease: auto
  name_template: >-
    {{ if regexMatch `-dev\.\d+$` .Tag }}Development build {{ .Tag }}{{ else }}{{ .Tag }}{{ end }}
