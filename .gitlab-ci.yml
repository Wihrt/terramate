workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - test
  - version
  - release

variables:
  GIT_DEPTH: 0

default:
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -qq -y curl git ca-certificates build-essential >/dev/null
    - curl -fsSL https://mise.run | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - mise trust

build_test:
  stage: test
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mise run build
    - mise run generate
    - git diff --exit-code
    - mise run test

.cog_bump_setup: &cog_bump_setup
  - git config user.email "ci-cog-bot@terramate.io"
  - git config user.name "Terramate CI (cocogitto)"
  - git checkout -B main "$CI_COMMIT_SHA"
  - git fetch --tags --force origin
  - git remote set-url origin "https://oauth2:${COG_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

cut_dev_version:
  stage: version
  needs: ["build_test"]
  resource_group: cog-bump
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - *cog_bump_setup
    - mise exec -- cog bump --auto --pre "dev.*"

cut_release_major:
  stage: version
  needs: ["build_test"]
  resource_group: cog-bump
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - *cog_bump_setup
    - mise exec -- cog bump --major --hook-profile release

cut_release_minor:
  extends: cut_release_major
  script:
    - *cog_bump_setup
    - mise exec -- cog bump --minor --hook-profile release

cut_release_patch:
  extends: cut_release_major
  script:
    - *cog_bump_setup
    - mise exec -- cog bump --patch --hook-profile release

cut_release_auto:
  extends: cut_release_major
  script:
    - *cog_bump_setup
    - mise exec -- cog bump --auto --hook-profile release

publish_release:
  stage: release
  needs: ["build_test"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev\.\d+)?$/'
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN # goreleaser -> GitLab Releases API, not a push
  script:
    - mise exec -- goreleaser release --clean
