name: OSS / Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_test:
    name: Build and Test
    uses: ./.github/workflows/oss-build-test.yml

  publish_dev:
    name: Publish dev binaries
    needs: build_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Run GoReleaser (snapshot build, no publish to GitHub by goreleaser itself)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish

      - name: Update floating dev pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: dev
          name: "Development build (main@${{ github.sha }})"
          prerelease: true
          make_latest: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
